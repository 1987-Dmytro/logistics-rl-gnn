[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logistics-rl-gnn"
version = "0.0.0"  # pre-release; __version__ pinned to 0.0.0 (test_smoke) until a tagged release
description = "Dynamic vehicle routing (CVRPTW) via Graph Neural Networks + Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dmytro Gordiyenko", email = "gordiyenko.d@gmail.com" }]
keywords = [
    "vehicle-routing", "cvrptw", "reinforcement-learning", "graph-neural-networks",
    "operations-research", "logistics", "pomo", "or-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]

# NOTE: runtime dependencies (torch / torch-geometric / gymnasium / ortools ...)
# are pinned AFTER the RL problem statement and the target hardware are fixed (CPU vs ROCm).
dependencies = []

# (Must come AFTER all [project] bare keys — a sub-table ends the [project] key list.)
[project.urls]
Repository = "https://github.com/1987-Dmytro/logistics-rl-gnn"
Issues = "https://github.com/1987-Dmytro/logistics-rl-gnn/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
# Phase 2: the OSMnx pipeline (CPU). geopandas/shapely come with osmnx.
data = [
    "osmnx>=2.0,<3",
    "networkx>=3.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=15",  # parquet I/O for matrices/nodes
    "pyyaml>=6",  # scenarios/*.yaml (config.scenario — a custom dispatcher day)
]
# Phase 3: the RL environment.
env = [
    "gymnasium>=1.0",
    "opening_hours_py",  # parsing OSM opening_hours (Rust binding; module usually opening_hours)
]
# Phase 4: baselines (an honest "before"). OR-Tools CVRPTW; greedy needs no extra deps.
baselines = [
    "ortools>=9.10",
]
# Phase 5: the GNN+attention policy (CPU). Install torch from the CPU index:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
model = [
    "torch>=2.2",
    "torch-geometric>=2.5",
]
# Phase 8: case visualisation (maps/animations/curves). osmnx/networkx already in [data].
viz = [
    "matplotlib>=3.8",
    "imageio>=2.34",
    "folium>=0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
