[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logistics-rl-gnn"
version = "0.0.0"  # pre-release; __version__ pinned to 0.0.0 (test_smoke) until a tagged release
description = "Dynamic vehicle routing (CVRPTW) via Graph Neural Networks + Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dmytro Gordiyenko", email = "gordiyenko.d@gmail.com" }]
keywords = [
    "vehicle-routing", "cvrptw", "reinforcement-learning", "graph-neural-networks",
    "operations-research", "logistics", "pomo", "or-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]

# NOTE: рантайм-зависимости (torch / torch-geometric / gymnasium / ortools ...)
# пиним ПОСЛЕ фиксации постановки RL-задачи и целевого железа (CPU vs ROCm).
dependencies = []

# TODO(publish): replace <user> with the real GitHub path before release.
# (Must come AFTER all [project] bare keys — a sub-table ends the [project] key list.)
[project.urls]
Repository = "https://github.com/<user>/logistics-rl-gnn"
Issues = "https://github.com/<user>/logistics-rl-gnn/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
# Phase 2: OSMnx-пайплайн (CPU). geopandas/shapely подтянет osmnx.
data = [
    "osmnx>=2.0,<3",
    "networkx>=3.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=15",  # parquet I/O для матриц/узлов
    "pyyaml>=6",  # scenarios/*.yaml (config.scenario — кастомный день диспетчера)
]
# Phase 3: RL-среда.
env = [
    "gymnasium>=1.0",
    "opening_hours_py",  # парсинг OSM opening_hours (Rust-биндинг; модуль обычно opening_hours)
]
# Phase 4: бейзлайны (честное «Было»). OR-Tools CVRPTW; greedy — без доп. депов.
baselines = [
    "ortools>=9.10",
]
# Phase 5: политика GNN+attention (CPU). torch ставить с CPU-index:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
model = [
    "torch>=2.2",
    "torch-geometric>=2.5",
]
# Phase 8: визуализация кейса (карты/анимации/кривые). osmnx/networkx уже в [data].
viz = [
    "matplotlib>=3.8",
    "imageio>=2.34",
    "folium>=0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
