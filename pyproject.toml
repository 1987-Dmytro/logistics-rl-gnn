[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logistics-rl-gnn"
version = "0.0.0"
description = "Dynamic vehicle routing (CVRPTW) via Graph Neural Networks + Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dmytro Gordiyenko", email = "gordiyenko.d@gmail.com" }]

# NOTE: рантайм-зависимости (torch / torch-geometric / gymnasium / ortools ...)
# пиним ПОСЛЕ фиксации постановки RL-задачи и целевого железа (CPU vs ROCm).
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
