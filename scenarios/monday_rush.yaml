# Monday, the whole city, full fleet — and TWO traffic incidents in a row during the morning peak.
# c(dow,h) on Monday equals Tuesday (the weekday factor is 1.0) — the difference from the default
# run comes EXACTLY from the two incidents, not from the day of the week.
name: monday_rush
weekday: monday
pharmacies: all
fleet: {K: 8, Q: 80}

events:
  - at: "08:25"
    type: traffic
    where: Bergius-Apotheke
    params: {magnitude: 1.8, radius_km: 1.5, duration_min: 60}
  - at: "08:50"
    type: traffic
    where: Ludwigs-Apotheke
    params: {closure: true, radius_km: 1.2, duration_min: 40}
