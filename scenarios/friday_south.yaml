# Friday, the southern cluster of Augsburg only, a reduced fleet (2 vehicles).
# Pharmacy windows are the REAL opening_hours for Friday (pharmacies closed that day drop out —
# the demo says so explicitly). The congestion profile c(dow=4, h) is the same as on weekdays.
name: friday_south
weekday: friday
dispatch_start: "08:00"

pharmacies:
  - Gisela Apotheke
  - Tattenbach Apotheke
  - Johannes-Apotheke
  - Apotheke Inningen
  - Easy Apotheke
  - Vita-Apotheke
  - Apotheke an der Universität
  - Lotos-Apotheke
  - St. Anna Apotheke
  - Bergius-Apotheke
  - Kurhaus-Apotheke
  - Zwölf-Apostel-Apotheke
  - Hochfeld-Apotheke
  - Prinz-Karl-Apotheke

fleet: {K: 2, Q: 80}

# a large Friday top-up at two pharmacies (boxes on top of the seeded draw)
demand:
  Vita-Apotheke: 14
  Bergius-Apotheke: 12

events:
  # 08:50 — half the cluster is still undelivered: the remainder is substantial (7 of 14 stops)
  - at: "08:50"
    type: traffic
    where: Vita-Apotheke
    params: {magnitude: 1.6, radius_km: 1.5, duration_min: 45}
